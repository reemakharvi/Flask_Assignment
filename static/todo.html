
<!DOCTYPE html>
<html>
<head>
    <title>To-Do Application</title>
</head>
<body>
    <h1>To-Do List</h1>

    <form id="todoForm">
        <label>Item ID:</label>
        <input type="text" id="itemId" required>
        <br><br>

        <label>Item UUID:</label>
        <input type="text" id="itemUUID" required>
        <br><br>

        <label>Item Hash:</label>
        <input type="text" id="itemHash" required>
        <br><br>

        <label>Item Name:</label>
        <input type="text" id="itemName" required>
        <br><br>

        <label>Item Description:</label>
        <textarea id="itemDescription" required></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="response"></p>

    <script>
        document.getElementById("todoForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const itemId = document.getElementById("itemId").value;
            const itemUUID = document.getElementById("itemUUID").value;
            const itemHash = document.getElementById("itemHash").value;
            const itemName = document.getElementById("itemName").value;
            const itemDescription = document.getElementById("itemDescription").value;

            try {
                const result = await fetch("/submittodoitem", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        itemId,
                        itemUUID,
                        itemHash,
                        itemName,
                        itemDescription
                    })
                });

                const data = await result.json();
                document.getElementById("response").textContent = data.message;
            } catch (error) {
                document.getElementById("response").textContent = "Submission failed";
            }
        });
    </script>
</body>
</html>
